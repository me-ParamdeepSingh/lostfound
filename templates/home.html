{% extends 'base.html' %}

{% block content %}
<form method="GET" class="mb-4">

    <input type="text" name="q" placeholder="Search..." class="form-control mb-2">

    <select name="type" class="form-control mb-2">
        <option value="">All</option>
        <option value="lost">Lost</option>
        <option value="found">Found</option>
    </select>

    <button class="btn btn-success">Filter</button>
</form>

<h2 class="mb-4">Lost & Found Items</h2>

<div class="row">
    {% for item in items %}
    <div class="col-md-4">
        <div class="card mb-4 shadow">
            <img src="{{ item.image.url }}" class="card-img-top" style="height:200px; object-fit:cover;">

            <div class="card-body">
                <h5 class="card-title">{{ item.title }}</h5>

                <span class="badge bg-{% if item.item_type == 'lost' %}danger{% else %}success{% endif %}">
                    {{ item.item_type|title }}
                </span>

                <p class="mt-2">{{ item.description|truncatewords:10 }}</p>

                <p><strong>📍 {{ item.location }}</strong></p>
                <a href="/item/{{ item.id }}/" class="btn btn-primary">View Details</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
