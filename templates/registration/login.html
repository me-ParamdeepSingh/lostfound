{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4 shadow">
            <h3 class="text-center">Login</h3>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}

                <button class="btn btn-primary w-100">Login</button>
            </form>
            <p class="text-center">
                <a href="/password-reset/">Forgot Password?</a>
            </p>
        </div>
    </div>
</div>

{% endblock %}
