{% extends 'base.html' %}

{% block title %}Reset Password | Lost &amp; Found{% endblock %}

{% block content %}

<div class="row justify-content-center my-4">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm p-4 p-md-5 bg-white text-center" style="border-radius: 20px;">
            
            <div class="d-inline-flex align-items-center justify-content-center mb-3 mx-auto" style="width: 58px; height: 58px; background: #e0e7ff; border-radius: 16px;">
                <i class="bi bi-key-fill text-primary fs-3"></i>
            </div>
            
            <h3 class="fw-extrabold text-dark mb-1">Forgot Password?</h3>
            <p class="text-muted small mb-4">Enter your registered email address and we'll send you a password reset link.</p>

            <form method="POST" class="text-start">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label fw-bold small text-dark">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control" placeholder="Enter your email" required autofocus>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-pill fw-bold shadow-sm">
                    <i class="bi bi-send-fill me-1"></i> Send Password Reset Link
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <a href="/accounts/login/" class="small text-muted text-decoration-none">
                    <i class="bi bi-arrow-left"></i> Back to Login
                </a>
            </div>

        </div>
    </div>
</div>

{% endblock %}
