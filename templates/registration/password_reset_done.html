{% extends 'base.html' %}

{% block title %}Reset Link Dispatched | Lost &amp; Found{% endblock %}

{% block content %}

<div class="row justify-content-center my-4">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm p-4 p-md-5 bg-white text-center" style="border-radius: 20px;">
            
            <div class="d-inline-flex align-items-center justify-content-center mb-3 mx-auto" style="width: 64px; height: 64px; background: #ecfdf5; border-radius: 50%;">
                <i class="bi bi-envelope-check-fill text-success fs-2"></i>
            </div>
            
            <h3 class="fw-extrabold text-dark mb-1">Check Your Email</h3>
            <p class="text-muted small mb-4">
                If an account exists with the email you entered, we've sent password reset instructions.
            </p>

            <a href="/accounts/login/" class="btn btn-primary w-100 py-2.5 rounded-pill fw-bold shadow-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Return to Login
            </a>

        </div>
    </div>
</div>

{% endblock %}
