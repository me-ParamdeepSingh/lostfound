{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4 shadow">
            <h3 class="text-center">Verify OTP</h3>

            <form method="POST">
                {% csrf_token %}
                <input type="text" name="otp" class="form-control mb-3" placeholder="Enter OTP">
                <button class="btn btn-success w-100">Verify</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
